<!doctype html>
<html lang="zh-Hans">
<head>
  <script>try{var l=localStorage.getItem('zv-lang')==='en'?'en':'zh';document.documentElement.dataset.lang=l;document.documentElement.lang=l==='en'?'en':'zh-Hans';}catch(e){}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>抽奖 · ZÉLL-V 健康一起 WIN</title>
  <link rel="icon" href="assets/logos/carousel-icon-32.png">
  <meta name="theme-color" content="#F6EFE1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Serif+SC:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    html, body.draw-page { height: 100%; overflow: hidden; background: #f6efe1; }
    .draw-denied { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .draw-shell { position: fixed; inset: 0; display: flex; flex-direction: column; background: #f6efe1; }
    body.draw-page:has(.env-banner) .draw-shell { bottom: 2rem; }
    .dbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 12px; background: rgba(251,247,238,.94);
      border-bottom: 1px solid #e6d3a4; z-index: 20;
    }
    .dbar .brand-word { height: 18px; }
    .dchips { display: flex; flex-wrap: wrap; gap: 6px; }
    .dchip, .dtool {
      border: 1px solid #c9a04f; background: #fffdf8; color: #6e521c;
      border-radius: 999px; padding: 6px 12px; font: 700 12px/1 Montserrat, sans-serif;
      letter-spacing: .04em; cursor: pointer; text-decoration: none;
    }
    .dchip.active { background: linear-gradient(180deg,#e8c979,#b8892f); color: #fff; border-color: transparent; }
    .dchip:disabled, .dtool:disabled { opacity: .45; cursor: default; }
    .dtools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .dforfeit { position: relative; }
    .dforfeit-pop {
      position: absolute; right: 0; top: calc(100% + 6px); width: min(320px, 80vw);
      background: #fffdf8; border: 1px solid #e6d3a4; border-radius: 12px;
      box-shadow: 0 18px 40px rgba(120,85,25,.16); padding: 10px; z-index: 30;
    }
    .dforfeit-pop button { display: block; width: 100%; text-align: left; margin-top: 6px; }
    #stage { position: relative; flex: 1 1 auto; min-height: 0; }
    #stage.zd { height: auto; flex: 1 1 auto; min-height: 0; }
    #stage-msg { position: absolute; inset: 0; display: grid; place-items: center; color: #7a6740; }
  </style>
</head>
<body class="draw-page">
  <div id="denied" class="draw-denied" hidden>
    <div class="card">
      <h2>只限管理员 <span class="en">Admins only</span></h2>
      <p>抽奖页面只供管理员使用。<span class="en">The draw screen is for admins only.</span></p>
      <a class="btn btn-primary" href="sales.html">返回 <span class="en">Back</span></a>
    </div>
  </div>

  <div class="draw-shell" id="app" hidden>
    <header class="dbar">
      <img class="brand-word" src="assets/logos/zellv-wordmark-charcoal.webp" alt="ZÉLL-V">
      <div class="dchips" id="round-chips" role="group" aria-label="轮次 Round"></div>
      <div class="dchips" id="cat-chips" role="group" aria-label="奖项 Prize"></div>
      <div class="dtools">
        <div class="dforfeit">
          <button type="button" class="dtool" id="forfeit-btn">放弃 <span class="en">Forfeit</span></button>
          <div class="dforfeit-pop" id="forfeit-pop" hidden></div>
        </div>
        <button type="button" class="dtool" id="fs-btn" title="全屏 Fullscreen (F)">全屏 <span class="en">Full</span></button>
        <a class="dtool" href="admin.html">管理 <span class="en">Admin</span></a>
      </div>
    </header>
    <div id="stage"><p id="stage-msg">加载抽奖券… <span class="en">Loading tickets…</span></p></div>
  </div>

  <dialog id="reason-dialog" class="dialog">
    <form method="dialog">
      <h2 class="reason-title"></h2>
      <textarea rows="3" maxlength="300" placeholder="原因 Reason" aria-label="原因 Reason"></textarea>
      <div class="btn-row">
        <button value="cancel" class="btn btn-ghost">取消 <span class="en">Cancel</span></button>
        <button value="ok" class="btn btn-primary">确认 <span class="en">Confirm</span></button>
      </div>
    </form>
  </dialog>

  <script src="draw/vendor/three.min.js"></script>
  <script src="draw/zell-draw.js?v=6"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/mock.js?v=4" defer></script>
  <script src="js/draw.js?v=6" defer></script>
</body>
</html>
